services:
  - type: web
    name: nexus-ai-api
    runtime: node
    plan: free
    region: singapore
    branch: phase-5/android-client-ready
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
